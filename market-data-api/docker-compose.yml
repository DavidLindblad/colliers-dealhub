version: '3.8'
services:
  api:
    build: .
    container_name: market-data-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=\
      - SUPABASE_SERVICE_ROLE_KEY=\
      - SUPABASE_TABLE_NAME=\
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
